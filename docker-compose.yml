services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: booking-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: booking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: ./eureka-server
    container_name: booking-eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      # Eureka serves its dashboard/registry once Spring Boot is fully up.
      # Node clients don't retry the initial registration, so downstream
      # services must wait for this to pass (service_healthy) rather than
      # just for the container to start.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./api-getway
    container_name: booking-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
    container_name: booking-user-service
    env_file:
      - ./user-service/.env
    environment:
      PORT: 5000
      MONGODB_URL: mongodb://mongo:27017/user-service-db
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      EUREKA_LEASE_RENEWAL_INTERVAL: 5
      EUREKA_LEASE_EXPIRATION_DURATION: 10
      EUREKA_HEARTBEAT_INTERVAL: 5000
      EUREKA_REGISTRY_FETCH_INTERVAL: 5000
    ports:
      - "5000:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  nodification-service:
    build:
      context: ./nodification-service
    container_name: booking-notification-service
    env_file:
      - ./nodification-service/.env
    environment:
      PORT: 5001
      MONGODB_URL: mongodb://mongo:27017/notification-service-db
      RABBITMQ_URL: amqp://rabbitmq:5672
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      EUREKA_LEASE_RENEWAL_INTERVAL: 5
      EUREKA_LEASE_EXPIRATION_DURATION: 10
      EUREKA_HEARTBEAT_INTERVAL: 5000
      EUREKA_REGISTRY_FETCH_INTERVAL: 5000
    ports:
      - "5001:5001"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  movie-service:
    build:
      context: ./movie-service
    env_file:
      - ./movie-service/.env
    environment:
      PORT: 5002
      MONGODB_URL: mongodb://mongo:27017/movie-service-db
      RABBITMQ_URL: amqp://rabbitmq:5672
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      EUREKA_LEASE_RENEWAL_INTERVAL: 5
      EUREKA_LEASE_EXPIRATION_DURATION: 10
      EUREKA_HEARTBEAT_INTERVAL: 5000
      EUREKA_REGISTRY_FETCH_INTERVAL: 5000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  booking-service:
    build:
      context: ./booking-service
    container_name: booking-booking-service
    env_file:
      - ./booking-service/.env
    environment:
      PORT: 5003
      MONGODB_URL: mongodb://mongo:27017/booking-service-db
      MOVIE_SERVICE_URL: http://movie-service:5002
      RABBITMQ_URL: amqp://rabbitmq:5672
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      EUREKA_LEASE_RENEWAL_INTERVAL: 5
      EUREKA_LEASE_EXPIRATION_DURATION: 10
      EUREKA_HEARTBEAT_INTERVAL: 5000
      EUREKA_REGISTRY_FETCH_INTERVAL: 5000
    ports:
      - "5003:5003"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      movie-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: booking-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  mongo-data:
